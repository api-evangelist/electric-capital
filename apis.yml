aid: electric-capital
name: Electric Capital
description: >-
  Electric Capital is an engineering-led venture capital firm founded in 2018 and
  headquartered in Palo Alto, California, investing in founders building frontier
  technologies across crypto, cryptography, distributed systems, and AI. The firm
  backs user-owned technology and cryptographic infrastructure that reduces reliance
  on intermediaries and gives users control, privacy, and access. Electric Capital
  invests from pre-seed through growth, with typical checks ranging from roughly
  $1M to $15M+, and has deployed more than $3B since inception across multiple funds
  (including a $1B raise announced in 2022). Its portfolio spans DeFi, layer-1 and
  layer-2 infrastructure, exchanges, developer tools, security, identity, and select
  AI, fintech, healthcare, and deep-tech companies, with notable investments including
  Solana, Kraken, EigenLayer/EigenCloud, dYdX, Magic Eden, Sui/Mysten Labs, NEAR,
  Consensys, and Aave. The firm is also known for authoring the widely cited annual
  Electric Capital Developer Report.
